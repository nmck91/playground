<div class="min-h-screen bg-gradient-to-b from-purple-500 to-indigo-600 p-4 flex flex-col">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <button (click)="goBack()" class="text-white">
      ← Back
    </button>
    <div class="text-white text-sm">
      Progress: {{ challengeProgress() | number:'1.0-0' }}%
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="w-full bg-white/20 rounded-full h-3 mb-8">
    <div
      class="bg-yellow-400 h-3 rounded-full transition-all duration-300"
      [style.width.%]="challengeProgress()"
    ></div>
  </div>

  <!-- Problem Display -->
  @if (currentProblem()) {
    <div class="flex-1 flex flex-col items-center justify-center">
      <!-- Problem -->
      <div class="bg-white rounded-2xl p-8 shadow-xl mb-8 min-w-[300px]">
        <div class="text-4xl font-bold text-center text-gray-800">
          {{ currentProblem()?.displayString }}
        </div>
      </div>

      <!-- Feedback -->
      @if (showFeedback) {
        <div
          class="text-6xl mb-8 animate-bounce"
          [class.text-green-400]="isCorrect"
          [class.text-red-400]="!isCorrect"
        >
          {{ isCorrect ? '✓' : '✗' }}
        </div>
      }

      <!-- Answer Input -->
      @if (!showFeedback) {
        <div class="flex flex-col items-center gap-4">
          <input
            #answerInput
            type="number"
            [(ngModel)]="userAnswer"
            class="text-3xl text-center w-48 p-4 rounded-xl border-4 border-yellow-400 focus:outline-none focus:border-yellow-500"
            placeholder="?"
            (keyup.enter)="submitAnswer()"
          />
          <button
            (click)="submitAnswer()"
            [disabled]="!userAnswer"
            class="bg-yellow-400 text-gray-800 px-8 py-4 rounded-xl font-bold text-xl hover:bg-yellow-500 disabled:opacity-50 transition-colors"
          >
            Submit
          </button>
        </div>
      }
    </div>
  }
</div>

<div class="min-h-screen bg-gradient-to-b from-green-400 to-blue-500 p-4">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div class="text-white">
      <div class="font-bold">{{ activePlayer()?.name }}</div>
      <div class="text-sm">Level {{ activePlayer()?.currentLevel }}</div>
    </div>
    <div class="flex gap-2">
      <button (click)="goToPassport()" class="bg-white/20 text-white px-4 py-2 rounded-lg">
        📜 Passport
      </button>
      <button (click)="goToPets()" class="bg-white/20 text-white px-4 py-2 rounded-lg">
        🐕 Pets
      </button>
      <button (click)="switchPlayer()" class="bg-white/20 text-white px-4 py-2 rounded-lg">
        👤 Switch
      </button>
    </div>
  </div>

  <!-- Title -->
  <h1 class="text-3xl font-bold text-white text-center mb-8">
    World Map
  </h1>

  <!-- Locations Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl mx-auto">
    @for (location of locations(); track location.id) {
      <button
        (click)="selectLocation(location)"
        [disabled]="!isLocationUnlocked(location)"
        class="bg-white rounded-lg overflow-hidden shadow-lg transition-all"
        [class.opacity-50]="!isLocationUnlocked(location)"
        [class.hover:shadow-xl]="isLocationUnlocked(location)"
        [class.cursor-not-allowed]="!isLocationUnlocked(location)"
      >
        <!-- Location Image -->
        <div class="aspect-video bg-gray-100 relative overflow-hidden">
          <img
            [src]="location.thumbnailImage"
            [alt]="location.name"
            class="w-full h-full object-cover"
          />
          @if (!isLocationUnlocked(location)) {
            <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
              <div class="text-white text-4xl">🔒</div>
            </div>
          }
        </div>

        <!-- Location Info -->
        <div class="p-4">
          <div class="font-bold text-lg">{{ location.name }}</div>
          <div class="text-sm text-gray-600 mb-2">{{ location.description }}</div>
          @if (!isLocationUnlocked(location)) {
            <div class="text-xs text-red-500">
              Need {{ location.requiredStamps }} stamps
            </div>
          } @else {
            <div class="text-xs text-green-500">
              ✅ Unlocked
            </div>
          }
        </div>
      </button>
    }
  </div>
</div>

<div class="min-h-screen bg-gradient-to-b from-blue-400 to-blue-600 p-8">
  <div class="max-w-2xl mx-auto">
    <!-- Title -->
    <h1 class="text-4xl font-bold text-white text-center mb-8">
      Math Quest
    </h1>
    <h2 class="text-2xl text-white text-center mb-8">
      Choose Your Explorer
    </h2>

    <!-- Player List -->
    @if (players().length > 0) {
      <div class="grid gap-4 mb-8">
        @for (player of players(); track player.id) {
          <button
            (click)="selectPlayer(player.id)"
            class="bg-white rounded-lg p-4 shadow-lg hover:shadow-xl transition-shadow flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center text-2xl">
                🧭
              </div>
              <div class="text-left">
                <div class="font-bold text-lg">{{ player.name }}</div>
                <div class="text-sm text-gray-600">
                  Level {{ player.currentLevel }} • {{ player.stamps.length }} stamps
                </div>
              </div>
            </div>
            <button
              (click)="deletePlayer(player.id, $event)"
              class="text-red-500 hover:text-red-700 p-2"
              title="Delete explorer"
            >
              ✕
            </button>
          </button>
        }
      </div>
    }

    <!-- Create New Player -->
    @if (showCreateForm) {
      <div class="bg-white rounded-lg p-6 shadow-lg">
        <h3 class="text-xl font-bold mb-4">New Explorer</h3>
        <input
          type="text"
          [(ngModel)]="newPlayerName"
          placeholder="Enter your name"
          class="w-full p-3 border rounded-lg mb-4"
          maxlength="20"
          (keyup.enter)="createPlayer()"
        />
        <div class="flex gap-4">
          <button
            (click)="createPlayer()"
            [disabled]="!newPlayerName.trim()"
            class="flex-1 bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600 disabled:opacity-50"
          >
            Start Adventure!
          </button>
          <button
            (click)="toggleCreateForm()"
            class="px-6 bg-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-400"
          >
            Cancel
          </button>
        </div>
      </div>
    } @else {
      <button
        (click)="toggleCreateForm()"
        class="w-full bg-yellow-400 text-gray-800 py-4 rounded-lg font-bold text-lg hover:bg-yellow-500 transition-colors"
      >
        + New Explorer
      </button>
    }
  </div>
</div>

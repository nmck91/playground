<div class="min-h-screen bg-gradient-to-b from-pink-300 to-purple-400 p-4">
  <!-- Header -->
  <div class="flex items-center mb-6">
    <button (click)="goBack()" class="text-white">
      ← Back
    </button>
  </div>

  <h1 class="text-3xl font-bold text-white text-center mb-8">
    🐾 My Pets
  </h1>

  <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
    @for (petDef of allPets; track petDef.species) {
      <button
        (click)="selectPet(petDef.species)"
        [disabled]="!hasPet(petDef.species)"
        class="bg-white rounded-lg p-4 shadow-lg transition-all"
        [class.ring-4]="isActivePet(petDef.species)"
        [class.ring-yellow-400]="isActivePet(petDef.species)"
        [class.opacity-50]="!hasPet(petDef.species)"
      >
        <div class="text-4xl mb-2">
          @switch (petDef.species) {
            @case ('dog') { 🐕 }
            @case ('cheetah') { 🐆 }
            @case ('eagle') { 🦅 }
            @case ('shark') { 🦈 }
          }
        </div>
        <div class="font-bold">{{ petDef.displayName }}</div>
        <div class="text-xs text-gray-600">{{ petDef.description }}</div>

        @if (!hasPet(petDef.species)) {
          <div class="text-xs text-red-500 mt-2">
            🔒 Locked
          </div>
        } @else if (isActivePet(petDef.species)) {
          <div class="text-xs text-green-500 mt-2">
            ✓ Active
          </div>
        }
      </button>
    }
  </div>
</div>

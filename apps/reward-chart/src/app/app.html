<div class="max-w-7xl mx-auto px-16 md:px-24" *ngIf="chartData$ | async as chartData">
  <app-header
    [weekDisplay]="weekDisplay"
    (showRewards)="onShowRewards()"
    (showSettings)="onShowSettings()"
    (newWeek)="onNewWeek()">
  </app-header>

  <!-- Kids Chart Section -->
  <div class="bg-white rounded-lg shadow-sm mb-24 overflow-hidden">
    <div class="p-16 bg-cream-100 border-b border-slate-200 flex justify-between items-center">
      <h2 class="text-2xl md:text-xl font-semibold text-slate-900 m-0">👶 Kids' Chart</h2>
    </div>
    <div class="p-16">
      <div class="grid gap-16" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));">
        <app-child-card
          *ngFor="let child of chartData.children; let i = index"
          [person]="child"
          [personIndex]="i"
          [section]="'kids'"
          [habits]="chartData.kidsHabits"
          [days]="chartData.days"
          [starsData]="chartData.kidsStars"
          [totalStars]="calculateTotalStars('kids', i)"
          [nextMilestone]="getNextMilestone(calculateTotalStars('kids', i), false)"
          (starToggled)="onStarToggled($event)">
        </app-child-card>
      </div>
    </div>
  </div>

  <!-- Parents Chart Section -->
  <div class="bg-white rounded-lg shadow-sm mb-24 overflow-hidden">
    <div class="p-16 bg-cream-100 border-b border-slate-200 flex justify-between items-center">
      <h2 class="text-2xl md:text-xl font-semibold text-slate-900 m-0">👨‍👩‍👧‍👦 Rate Mum & Dad!</h2>
      <button class="bg-transparent border-0 text-lg cursor-pointer text-slate-500 hover:text-slate-900 transition-colors duration-200" (click)="toggleParentsSection()">📊</button>
    </div>
    <div class="p-16" [class.hidden]="!chartData.parentsVisible">
      <div class="grid gap-16" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));">
        <app-child-card
          *ngFor="let parent of chartData.parents; let i = index"
          [person]="parent"
          [personIndex]="i"
          [section]="'parents'"
          [habits]="chartData.parentHabits"
          [days]="chartData.days"
          [starsData]="chartData.parentsStars"
          [totalStars]="calculateTotalStars('parents', i)"
          [nextMilestone]="getNextMilestone(calculateTotalStars('parents', i), true)"
          (starToggled)="onStarToggled($event)">
        </app-child-card>
      </div>
    </div>
  </div>

  <!-- Rewards Modal -->
  <app-rewards-modal
    [visible]="showRewardsModal"
    [kidsRewards]="chartData.kidsRewards"
    [parentsRewards]="chartData.parentsRewards"
    (closeModal)="onCloseRewards()"
    (updateReward)="onUpdateReward($event)"
    (deleteReward)="onDeleteReward($event)"
    (addReward)="onAddReward($event)">
  </app-rewards-modal>

  <!-- Settings Modal -->
  <app-settings-modal
    [visible]="showSettingsModal"
    [childrenNames]="getChildrenNames(chartData)"
    (closeModal)="onCloseSettings()"
    (saveSettings)="onSaveSettings($event)">
  </app-settings-modal>
</div>

name: PR Comment - Coverage Report

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  issues: write

jobs:
  coverage-comment:
    name: Post Coverage Report
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Parse coverage report
        id: coverage
        run: |
          if [ -f "coverage/libs/football-director-engine/coverage-summary.json" ]; then
            ENGINE_LINES=$(cat coverage/libs/football-director-engine/coverage-summary.json | jq -r '.total.lines.pct')
            ENGINE_BRANCHES=$(cat coverage/libs/football-director-engine/coverage-summary.json | jq -r '.total.branches.pct')
            ENGINE_FUNCTIONS=$(cat coverage/libs/football-director-engine/coverage-summary.json | jq -r '.total.functions.pct')
            echo "engine_lines=$ENGINE_LINES" >> $GITHUB_OUTPUT
            echo "engine_branches=$ENGINE_BRANCHES" >> $GITHUB_OUTPUT
            echo "engine_functions=$ENGINE_FUNCTIONS" >> $GITHUB_OUTPUT
          else
            echo "engine_lines=N/A" >> $GITHUB_OUTPUT
            echo "engine_branches=N/A" >> $GITHUB_OUTPUT
            echo "engine_functions=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const engineLines = '${{ steps.coverage.outputs.engine_lines }}';
            const engineBranches = '${{ steps.coverage.outputs.engine_branches }}';
            const engineFunctions = '${{ steps.coverage.outputs.engine_functions }}';

            const getEmoji = (pct) => {
              const num = parseFloat(pct);
              if (isNaN(num)) return '❓';
              if (num >= 90) return '🟢';
              if (num >= 80) return '🟡';
              return '🔴';
            };

            const formatPct = (pct) => {
              const num = parseFloat(pct);
              return isNaN(num) ? 'N/A' : `${num.toFixed(2)}%`;
            };

            const body = `## 📊 Coverage Report

            ### football-director-engine
            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Lines | ${formatPct(engineLines)} | ${getEmoji(engineLines)} |
            | Branches | ${formatPct(engineBranches)} | ${getEmoji(engineBranches)} |
            | Functions | ${formatPct(engineFunctions)} | ${getEmoji(engineFunctions)} |

            ### Thresholds
            - 🟢 ≥ 90% (Excellent)
            - 🟡 ≥ 80% (Good)
            - 🔴 < 80% (Needs Improvement)

            ---
            *Coverage report generated by CI*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

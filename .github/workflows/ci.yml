name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: write  # Changed to write for release merge

jobs:
  main:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Setup Node.js with caching
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Upgrade to npm 11.x to match local environment
      - run: npm install -g npm@11

      - run: npm ci
      - run: npx playwright install --with-deps

      # Clean build artifacts before linting
      - run: npx nx reset

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World

      # Build all projects (required to pass)
      - name: Build all projects
        run: npx nx run-many -t build

      # Lint all projects (required to pass)
      - name: Lint all projects
        run: npx nx run-many -t lint

      # Test football-director-engine with coverage (required to pass)
      - name: Test football-director-engine
        run: npx nx test football-director-engine --coverage --run

      # Check engine coverage thresholds
      - name: Check engine coverage thresholds
        run: node .github/scripts/check-coverage.js "football-director-engine" "coverage/libs/football-director-engine"

      # Test football-director app (required to pass)
      - name: Test football-director app
        run: npx nx test football-director --run

      # Test all other projects (required to pass)
      - name: Test all other projects
        run: npx nx run-many -t test --exclude=football-director,football-director-engine --run

      # Upload coverage reports
      - name: Upload engine coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/libs/football-director-engine/coverage-final.json
          flags: engine
          name: football-director-engine
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload app coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/apps/football-director/coverage-final.json
          flags: app
          name: football-director-app
          fail_ci_if_error: false
        continue-on-error: true

      # Archive coverage reports as artifacts
      - name: Archive coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
          retention-days: 30

      # Archive test results
      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/test-results/
          retention-days: 30

  merge-to-release:
    name: Merge to Release Branch
    runs-on: ubuntu-latest
    needs: main  # Only run if CI passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Merge main to release
        run: |
          git fetch origin release
          git checkout release
          git merge origin/main --ff-only --no-edit
          git push origin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

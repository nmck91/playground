name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: write  # Changed to write for release merge

jobs:
  main:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Temporarily disable cache to force clean install
          # cache: 'npm'

      # Upgrade to npm 11.x to match local environment
      - run: npm install -g npm@11

      # Clean npm cache before install
      - run: npm cache clean --force

      - run: npm ci
      - run: npx playwright install --with-deps

      # Clean build artifacts before linting
      - run: npx nx reset

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World

      # Build all projects (required to pass)
      - run: npx nx run-many -t build --exclude=football-director-spike,football-director-spike-e2e

      # Lint all projects except spikes (informational only for now)
      - run: npx nx run-many -t lint --exclude=football-director-spike,football-director-spike-e2e || true

      # Test all projects (required to pass for engine, informational for app and others)
      - run: npx nx test football-director-engine
      - run: npx nx test football-director || true
      - run: npx nx run-many -t test --exclude=football-director-spike,football-director-spike-e2e,football-director,football-director-engine || true

  merge-to-release:
    name: Merge to Release Branch
    runs-on: ubuntu-latest
    needs: main  # Only run if CI passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Merge main to release
        run: |
          git fetch origin release
          git checkout release
          git merge origin/main --ff-only --no-edit
          git push origin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
